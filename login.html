<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FITGYM</title>
  <link rel="stylesheet" href="fitgym.css">
</head>
<body>

  <div class="form-container">
    <h2 class="title">Login</h2>
    
    <form id="loginForm" class="form">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="senha" placeholder="Senha" required>
      <button type="submit">Entrar</button>
    </form>

    <div class="contato">
      <p>Em caso de dúvidas, entre em contato pelo email <strong>contato@fitgym.com</strong></p>
      <p>ou pelo telefone <strong>4002-8922</strong></p>
    </div>
    
    <div class="matricula-opcao">
      <p>Não tem conta? <a href="matricula.html">Faça sua matrícula</a></p>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("Login temporariamente indisponível. Por favor, tente novamente mais tarde.");
    });
  </script>
</body>
</html>
